name: Daily sharecard
on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run run:daily
        env:
          NH_BASE_URL: https://normalhoy.app
          NH_SHARECARD_TOKEN: ${{ secrets.NH_SHARECARD_TOKEN }}

